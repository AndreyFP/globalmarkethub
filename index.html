<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Global Market Hub</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;
    }
    .container {
      max-width: 1000px;
      margin: auto;
      padding: 40px 20px;
      text-align: center;
    }
    h1 {
      font-size: 48px;
      margin-bottom: 20px;
    }
    p {
      color: #cbd5e1;
      font-size: 18px;
    }
    .btn {
      margin-top: 20px;
      display: inline-block;
      padding: 14px 24px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 10px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-top: 50px;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      border-radius: 15px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Global Market Hub</h1>
  <p>Ваш хаб для товаров и решений по всему миру</p>
  <a class="btn">Начать</a>

  <div class="cards">
    <div class="card">
      <h3>Электроника</h3>
      <p>Гаджеты и товары</p>
    </div>
    <div class="card">
      <h3>Бизнес решения</h3>
      <p>Для магазинов и продаж</p>
    </div>
    <div class="card">
      <h3>Подбор</h3>
      <p>Найдём то, что нужно</p>
    </div>
  </div>
</div>

</body>
</html>
